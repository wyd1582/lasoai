<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laso AI · 文档</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<header class="top"><div class="bar"><a class="brand" href="./">← Laso AI<small>内部预览</small></a><span id="path" style="color:var(--muted);font-size:14px"></span></div></header>
<div class="wrap">
  <article class="md" id="doc"><p>…</p></article>
</div>
<script>
(function () {
  var f = new URLSearchParams(location.search).get("f") || "";
  // only files the build copied: demo1..4/*.md and abl/docs/*.md
  if (!/^(demo[1-4]|abl\/docs)\/[A-Za-z0-9_.-]+\.md$/.test(f)) { document.getElementById("doc").textContent = "not found"; return; }
  document.getElementById("path").textContent = f;
  fetch(f).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      document.getElementById("doc").innerHTML = window.marked ? marked.parse(md) : "<pre>" + md.replace(/[&<]/g, function (c) { return c === "&" ? "&amp;" : "&lt;"; }) + "</pre>";
      var h = document.querySelector("#doc h1"); if (h) document.title = "Laso AI · " + h.textContent;
    })
    .catch(function () { document.getElementById("doc").textContent = "not found: " + f; });
})();
</script>
</body>
</html>
